# Señales de la Tabla 57. Los nombres de destino son los contenedores de infra/staging.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [alertas.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ['alertmanager:9093'] }] }]
scrape_configs:
  - job_name: api # p95 por ruta, 5xx y errores de negocio (RNF-REN-001)
    metrics_path: /metricas
    static_configs: [{ targets: ['sce-api:3001'] }]
  - job_name: base
    static_configs: [{ targets: ['postgres:9187'] }]
  - job_name: nodo # uso de recursos del servidor
    static_configs: [{ targets: ['nodo:9100'] }]
  - job_name: contenedores
    static_configs: [{ targets: ['contenedores:8080'] }]
  - job_name: salud # healthcheck de API y web por el proxy, como el monitor externo (CO-FIA-01)
    metrics_path: /probe
    params: { module: [https_salud] }
    static_configs:
      - targets: ['https://sce-proxy/api/salud', 'https://sce-proxy/salud']
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 'blackbox:9115' }
