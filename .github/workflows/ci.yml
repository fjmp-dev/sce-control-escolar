# Pipeline de integracion: etapas 1 a 5 de la Tabla 53 (sec. 31.1). Cada etapa es criterio de avance de la siguiente.
# Las etapas 6 y 7 llegan en el Batch 3 y la 8 en el Batch 6. Dentro de que etapa corre cada herramienta que
# la Tabla 53 no nombra: docs/calidad/plan-de-pruebas.md, seccion 4.1.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  construccion:
    name: 1 Construcción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript estricto (Tabla 32)
        run: npm run build

  analisis:
    name: 2 Análisis estático
    needs: construccion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Commitlint y Gitleaks necesitan el historial
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - name: Prettier (Tabla 32)
        run: npm run format:check
      - name: Commitlint (Tablas 31 y 32)
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha || github.event.before }}
          --to ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm ci
        working-directory: api
      - run: npx prisma generate
        working-directory: api
      - name: ESLint con el plugin de TypeScript, sin any (Tabla 32, AU-10)
        run: npm run lint
        working-directory: api
      - name: Gitleaks sobre el historial completo (CS-SEG-08, AU-13)
        run: scripts/gitleaks-historial.sh gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks
          path: gitleaks.json
          retention-days: 90

  unitarias:
    name: 3 Pruebas unitarias
    needs: analisis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Jest con cobertura, al menos 80 % en el dominio (Tablas 53 y 59)
        run: npm run test:unitarias
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-unitarias
          path: api/coverage/unitarias/
          if-no-files-found: ignore
          retention-days: 90

  integracion:
    name: 4 Pruebas de integración
    needs: unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Supertest y Testcontainers sobre PostgreSQL 16 efimero (CI-MIG-01, CI-AUTH-01, CF-ROL-01, CS-SEG, CD-DAT)
        run: npm run test:integracion
      - name: Levantar PostgreSQL 16 y la API con datos sinteticos
        working-directory: .
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Newman - contratos de API y CS-SEG-04 (Tablas 30, 42 y 49)
        working-directory: .
        run: scripts/newman.sh http://localhost:3001 reportes/newman
      - if: failure()
        working-directory: .
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-integracion
          path: api/coverage/integracion/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman
          path: reportes/newman/
          if-no-files-found: ignore
          retention-days: 90

  calidad:
    name: 5 Calidad - SonarQube y npm audit
    needs: integracion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el commit base de la puerta de calidad
      - uses: actions/download-artifact@v4
        with:
          name: cobertura-integracion
          path: api/coverage/integracion
      - name: npm audit, cero altas o criticas (Tabla 32, AU-20)
        run: |
          mkdir -p reportes
          npm audit --json > reportes/npm-audit-raiz.json || true
          (cd api && npm audit --json > ../reportes/npm-audit-api.json || true)
          npm audit --audit-level=high
          (cd api && npm audit --audit-level=high)
      - name: Puerta de calidad sobre codigo nuevo (Tabla 51)
        run: scripts/sonar-puerta.sh "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD reportes/sonar
      - name: Resumen de la puerta
        if: always()
        run: cat reportes/sonar/resumen.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad
          path: reportes/
          retention-days: 90

  seguridad-imagen:
    name: 5 Seguridad - Trivy y humo del ambiente
    needs: integracion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar PostgreSQL 16 y la API con datos sinteticos
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Humo - salud, inicio de sesion y sesion actual con los seis roles y el administrador (F-01 #2)
        shell: bash # explicito: activa pipefail, para que un curl fallido no lo oculte jq
        run: |
          curl -sf localhost:3001/salud | jq -e '.estado == "ok"'
          for c in alumno profesor control.escolar coordinacion caja direccion administrador; do
            t=$(curl -sf -X POST localhost:3001/sesiones -H 'Content-Type: application/json' \
                  -d "{\"correo\":\"$c@sce.test\",\"contrasena\":\"sce-dev-2026\"}" | jq -er .token)
            curl -sf localhost:3001/sesiones/actual -H "Authorization: Bearer $t" \
              | jq -ec --arg rol "${c/./_}" 'select(.roles == [$rol]) | {cuenta: "'$c'", roles}'
          done
      - if: failure()
        run: docker compose logs
      - name: Trivy - imagen de la API (AU-20)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sce-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-imagen.txt
      - name: Trivy - repositorio (dependencias, secretos y configuracion)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: trivy-repositorio.txt
      - name: OWASP ZAP - CS-SEG-05 y registros sin datos sensibles (Tablas 30, 42 y 49; AU-20)
        if: always()
        run: scripts/zap.sh reportes/zap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy
          path: trivy-*.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap
          path: reportes/zap/
          if-no-files-found: ignore
          retention-days: 90
