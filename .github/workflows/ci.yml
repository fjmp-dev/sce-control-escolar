# Pipeline de integracion: etapas 1 a 7 de la Tabla 53 (sec. 31.1). Cada etapa es criterio de avance de la siguiente.
# La etapa 6 publica solo al integrar; en un pull request, la 7 ensaya con imagenes construidas ahi mismo.
# La 8, manual, esta en staging.yml. Dentro de que etapa corre cada herramienta que la Tabla 53 no nombra:
# docs/calidad/plan-de-pruebas.md, seccion 4.1.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'release/**'] # una etiqueta candidata en release tambien tiene imagenes firmadas

permissions:
  contents: read

env:
  CYPRESS_INSTALL_BINARY: 0 # Cypress corre en su imagen (scripts/cypress.sh); de npm solo hacen falta los tipos

jobs:
  construccion:
    name: 1 Construcción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript estricto en la API (Tabla 32)
        run: npm run build
      - run: npm ci
        working-directory: web
      - name: Contrato - los tipos del portal coinciden con el OpenAPI (Tabla 44)
        working-directory: web
        run: npm run tipos:api && git diff --exit-code lib/tipos-api.ts
      - name: TypeScript estricto en el portal, con Next.js (Tablas 32 y 53)
        working-directory: web
        run: npm run build && npm run tipos

  analisis:
    name: 2 Análisis estático
    needs: construccion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Commitlint y Gitleaks necesitan el historial
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Prettier (Tabla 32)
        run: npm run format:check
      - name: Commitlint (Tablas 31 y 32)
        env:
          DESDE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HASTA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Al crear una rama (release/x.y.z), GitHub manda "before" en ceros: se revisa desde el primer padre, porque
          # lo anterior ya paso por el pull request que lo integro.
          [ "$DESDE" != 0000000000000000000000000000000000000000 ] || DESDE="$(git rev-parse "$HASTA~1")"
          npx commitlint --verbose --from "$DESDE" --to "$HASTA"
      - run: npm ci
        working-directory: api
      - run: npx prisma generate
        working-directory: api
      - name: ESLint con el plugin de TypeScript, sin any (Tabla 32, AU-10)
        run: npm run lint
        working-directory: api
      - run: npm ci
        working-directory: web
      - name: ESLint en el portal, con las reglas de accesibilidad de Next.js (Tabla 32)
        working-directory: web
        run: npm run lint && npx tsc -p cypress/tsconfig.json
      - name: Gitleaks sobre el historial completo (CS-SEG-08, AU-13)
        run: scripts/gitleaks-historial.sh gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks
          path: gitleaks.json
          retention-days: 90
      - name: Cobertura de reglas Must en los títulos de las pruebas, 100 % (Tabla 59, CO-MAN-01)
        run: scripts/reglas-must.sh reportes/reglas-must.json
      - name: Fronteras de la Fig. 2 en ESLint detectan cada violacion (Tabla 15, Modularidad; CO-MAN-02)
        run: scripts/co-man-02.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reglas-must
          path: reportes/reglas-must.json
          retention-days: 90

  unitarias:
    name: 3 Pruebas unitarias
    needs: analisis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Jest con cobertura, al menos 80 % en el dominio (Tablas 53 y 59)
        run: npm run test:unitarias -- --json --outputFile=coverage/unitarias/jest.json # para la pirámide (etapa 7)
      - run: npm ci
        working-directory: web
      - name: Vitest y React Testing Library con cobertura (Tablas 42 y 53)
        working-directory: web
        run: npm run test:unitarias -- --reporter=default --reporter=json --outputFile.json=coverage/vitest.json
      - name: Calculo de disponibilidad mensual, con valores limite (CO-FIA-01)
        working-directory: .
        run: python3 -I scripts/disponibilidad.py --autoprueba
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-unitarias
          path: api/coverage/unitarias/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-portal
          path: web/coverage/
          if-no-files-found: ignore
          retention-days: 90

  integracion:
    name: 4 Pruebas de integración
    needs: unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Supertest y Testcontainers sobre PostgreSQL 16 efimero (CI-MIG-01, CI-AUTH-01, CF-ROL-01, CS-SEG, CD-DAT)
        run: npm run test:integracion -- --json --outputFile=coverage/integracion/jest.json # para la pirámide
      - name: Levantar PostgreSQL 16 y la API con datos sinteticos
        working-directory: .
        run: docker compose up -d --build --wait --wait-timeout 240 api
      - name: Newman - contratos de API y CS-SEG-04 (Tablas 30, 42 y 49)
        working-directory: .
        run: scripts/newman.sh http://localhost:3001 reportes/newman
      - name: Great Expectations - CD-DAT-01 a 06, Tabla 16, CS-SEG-06 y tasa de conclusión (Tablas 16, 39, 42 y 59; AU-22)
        working-directory: .
        run: scripts/calidad-datos.sh reportes/calidad-datos
      - name: Muestreo de bitácora y revisión de accesos, como artefacto (Tabla 57, sec. 18; AU-16)
        if: always()
        working-directory: .
        run: |
          mkdir -p reportes/calidad-datos
          for consulta in muestreo-bitacora accesos; do
            docker compose exec -T db psql -U sce_app -d sce -v ON_ERROR_STOP=1 \
              < "api/prisma/verificacion/$consulta.sql" > "reportes/calidad-datos/$consulta.txt"
          done
      - if: failure()
        working-directory: .
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-integracion
          path: api/coverage/integracion/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman
          path: reportes/newman/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad-datos
          path: reportes/calidad-datos/
          if-no-files-found: ignore
          retention-days: 90

  calidad:
    name: 5 Calidad - SonarQube y npm audit
    needs: integracion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el commit base de la puerta de calidad
      - uses: actions/download-artifact@v4
        with:
          name: cobertura-integracion
          path: api/coverage/integracion
      - uses: actions/download-artifact@v4
        with:
          name: cobertura-portal
          path: web/coverage
      - name: npm audit, cero altas o criticas (Tabla 32, AU-20)
        run: |
          mkdir -p reportes
          npm audit --json > reportes/npm-audit-raiz.json || true
          (cd api && npm audit --json > ../reportes/npm-audit-api.json || true)
          (cd web && npm audit --json > ../reportes/npm-audit-portal.json || true)
          npm audit --audit-level=high
          (cd api && npm audit --audit-level=high)
          (cd web && npm audit --audit-level=high)
      - name: Puerta de calidad sobre codigo nuevo (Tabla 51)
        env:
          DESDE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [ "$DESDE" != 0000000000000000000000000000000000000000 ] || DESDE="$(git rev-parse HEAD~1)" # rama nueva
          scripts/sonar-puerta.sh "$DESDE" HEAD reportes/sonar
      - name: Resumen de la puerta
        if: always()
        run: cat reportes/sonar/resumen.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad
          path: reportes/
          retention-days: 90

  seguridad-imagen:
    name: 5 Seguridad - Trivy y humo del ambiente
    needs: integracion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar PostgreSQL 16, la API y el portal con datos sinteticos
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Humo - salud e inicio de sesion con los seis roles y el administrador (F-01 #2)
        run: scripts/humo.sh
      - if: failure()
        run: docker compose logs
      - name: Trivy - imagen de la API (AU-20)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sce-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-imagen.txt
      - name: Trivy - imagen del portal (AU-20)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sce-portal:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-portal.txt
      - name: Trivy - repositorio (dependencias, secretos y configuracion)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: trivy-repositorio.txt
      - name: OWASP ZAP - CS-SEG-03, un alumno contra lo de otro (Tablas 42 y 49)
        if: always()
        run: scripts/zap-acceso-cruzado.sh reportes/zap-acceso-cruzado
      # Al final: deja bloqueada 15 minutos la cuenta del administrador (Tabla 38).
      - name: OWASP ZAP - CS-SEG-05 con los siete roles, registros sin datos sensibles y calidad de datos (Tablas 30, 42 y 49; AU-20)
        if: always()
        run: scripts/zap.sh reportes/zap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy
          path: trivy-*.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap
          path: |
            reportes/zap/
            reportes/zap-acceso-cruzado/
          if-no-files-found: ignore
          retention-days: 90

  empaquetado:
    name: 6 Empaquetado
    needs: [calidad, seguridad-imagen]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # firma sin llaves
    outputs:
      imagen_api: ${{ steps.publicar.outputs.imagen_api }}
      imagen_portal: ${{ steps.publicar.outputs.imagen_portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir, registrar y firmar sce-api y sce-portal (Tabla 53, AU-12)
        id: publicar
        run: scripts/publicar-imagenes.sh
      - uses: actions/upload-artifact@v4
        with:
          name: imagenes
          path: reportes/imagenes.md
          retention-days: 90

  despliegue-pruebas:
    name: 7 Despliegue a pruebas
    needs: [calidad, seguridad-imagen, empaquetado]
    # empaquetado se omite en un pull request; una omision por fallo de la etapa 5 la detienen las dos primeras condiciones.
    if: ${{ !cancelled() && needs.calidad.result == 'success' && needs.seguridad-imagen.result == 'success' && (needs.empaquetado.result == 'success' || needs.empaquetado.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGEN_API: ${{ needs.empaquetado.outputs.imagen_api }}
      IMAGEN_PORTAL: ${{ needs.empaquetado.outputs.imagen_portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Desplegar las imagenes registradas, solo si la firma es de este pipeline (Tabla 30, AU-12)
        if: github.event_name == 'push'
        run: |
          for imagen in "$IMAGEN_API" "$IMAGEN_PORTAL"; do
            cosign verify "$imagen" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/.*$" >/dev/null
          done
          docker compose pull api web
          docker compose up -d --no-build --wait --wait-timeout 300
      - name: Ensayo en pull request, con imagenes construidas aqui
        if: github.event_name == 'pull_request'
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Humo (Tabla 53, criterio de avance de la etapa)
        run: scripts/humo.sh | tee reportes-humo.txt
        shell: bash
      - name: Cypress con video y capturas, y axe - demostracion por rol (Tablas 42 y 44; 28.2)
        run: scripts/cypress.sh reportes/cypress
      - name: Lighthouse (Tabla 42, 28.2)
        if: always()
        run: scripts/lighthouse.sh reportes/lighthouse
      # CO-COM-01 (Tabla 50), después de Cypress, que espera las cuentas de la semilla sin tocar. Chrome y Edge estables
      # ya vienen en ubuntu-latest (canales chrome y msedge); Playwright solo trae Chromium, Firefox y WebKit. Los
      # reportes quedan en reportes/playwright, dentro del artefacto despliegue-pruebas.
      - name: Navegadores de Playwright (Tabla 50)
        if: always()
        timeout-minutes: 20 # dos intentos; sin tope, una instalacion colgada espera 6 h (PR #106)
        env:
          DEBUG: pw:install # cada descarga queda en el registro
        run: scripts/navegadores.sh
      - name: Compatibilidad Must - Chrome 1366 y 1920, iPhone, Android y zoom 200 % (Tabla 50, CO-COM-01)
        if: always()
        run: scripts/playwright.sh http://localhost:3000 reportes/playwright/must --project='must-*'
      - name: Compatibilidad Should - Firefox y Edge, no bloquea (Tabla 50, CO-COM-01)
        if: always()
        continue-on-error: true
        run: scripts/playwright.sh http://localhost:3000 reportes/playwright/should --project='should-*'
      - name: Humo de rendimiento con k6 y los umbrales de la Tabla 46 (Tabla 48; no sustituye a CR-REN)
        if: always()
        run: |
          mkdir -p reportes/k6 && chmod a+rwx reportes/k6
          docker run --rm --network host -v "$PWD/infra/rendimiento:/r:ro" -v "$PWD/reportes/k6:/salida" grafana/k6:1.6.0 \
            run -q --summary-export /salida/humo.json /r/humo.js
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: cobertura-* # con los reportes JSON de Jest y Vitest de las etapas 3 y 4
          path: ${{ runner.temp }}/piramide
      - name: Pirámide de pruebas, por caso y por archivo, contra 70/20/10 (Tabla 40); solo avisa
        if: always()
        run: |
          mkdir -p reportes
          scripts/piramide.sh "$RUNNER_TEMP/piramide/cobertura-unitarias/jest.json" \
            "$RUNNER_TEMP/piramide/cobertura-portal/vitest.json" \
            "$RUNNER_TEMP/piramide/cobertura-integracion/jest.json" reportes/cypress/reportes/junit \
            | tee reportes/piramide.md >> "$GITHUB_STEP_SUMMARY"
      - name: Staging efimero con estas imagenes - TLS 1.2+, base solo por TLS y SCRAM, pgAudit, humo del Anexo D y calidad de datos (CC-018)
        run: scripts/staging.sh "${IMAGEN_API:-sce-api:local}" "${IMAGEN_PORTAL:-sce-portal:local}"
      - name: Registro del despliegue (31.2)
        if: always()
        run: |
          mkdir -p reportes
          {
            echo "### Despliegue a pruebas"
            echo "- Ambiente: GitHub Actions, base efimera (Tabla 30)"
            echo "- Commit: $GITHUB_SHA"
            echo "- Evento: $GITHUB_EVENT_NAME en $GITHUB_REF_NAME"
            echo "- API: ${IMAGEN_API:-construida en esta corrida}"
            echo "- Portal: ${IMAGEN_PORTAL:-construido en esta corrida}"
            echo "- Fecha: $(date -u +%FT%TZ)"
            echo "- Resultado del job: ${{ job.status }}"
            echo
            cat reportes-humo.txt 2>/dev/null || true
            echo
            cat reportes/lighthouse/resumen.md 2>/dev/null || true
            echo
            scripts/matriz-compatibilidad.sh reportes/playwright/*/junit.xml 2>/dev/null || true
          } | tee reportes/despliegue.md >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: despliegue-pruebas
          path: reportes/
          retention-days: 90
