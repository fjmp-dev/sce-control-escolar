name: Solicitud de cambio
description: Cambio al alcance, requisitos, código, configuración o documentación (Anexo C)
labels: ['cambio']
body:
  - type: input
    id: identificador
    attributes:
      label: Identificador
      description: CC-NNN, consecutivo de docs/gobierno/registro-de-cambios.md.
    validations: { required: true }
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo (Tabla 34)
      options: [Menor, Normal, Mayor o Must, Emergencia, Documental]
    validations: { required: true }
  - type: input
    id: modulo
    attributes:
      label: Módulo afectado
    validations: { required: true }
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción y motivo
    validations: { required: true }
  - type: textarea
    id: impacto
    attributes:
      label: Análisis de impacto
      value: |
        - Alcance:
        - Esfuerzo:
        - Riesgos de datos:
        - Seguridad:
        - Rendimiento:
        - Requisitos tocados:
        - Ambiente destino:
    validations: { required: true }
  - type: textarea
    id: decision
    attributes:
      label: Decisión
      description: Aprobado o rechazado, con fecha y responsable. Quien aprueba no es quien solicitó.
  - type: textarea
    id: emergencia
    attributes:
      label: Solo si es de emergencia (Tabla 34; sección 37)
      description: 'Defecto crítico en piloto que afecta expediente, pago o acceso. Lo autorizan el Product Owner y DevOps, y se documenta en las 24 horas siguientes a aplicarlo.'
      value: |
        - Incidente o defecto que lo motivó:
        - Autorizó (Product Owner y DevOps), fecha y hora:
        - Aplicado, fecha y hora:
        - Documentado, fecha y hora (máximo 24 h después de aplicarlo):
        - Pruebas que se corrieron antes y después:
