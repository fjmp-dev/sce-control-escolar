# Etapa 8 de la Tabla 53: despliegue manual a staging, solo con etiqueta SemVer y acta, con autorizacion de PO y QA
# (sec. 31.2). La autorizacion es la regla de revisores del ambiente "staging" de GitHub: el job no empieza hasta que lo
# aprueban (hoy FJMP aprueba lo que lanza: NC-012). Despliega las imagenes que firmo la etapa 6 para el commit de la
# etiqueta, sin reconstruirlas: el mismo digest ira a piloto (Tabla 30). Staging es efimero (CC-018): se arma en este
# runner con la topologia de la Fig. 9, se verifica y se destruye; la evidencia queda como artefacto. Procedimiento:
# docs/gobierno/inventario-de-ambientes.md.
name: 8 Despliegue a staging

# 11.4: tambien corre al empujar una etiqueta candidata vX.Y.Z-rc.N. GitHub usa entonces el staging.yml del commit
# etiquetado, asi que no necesita estar en main, y el acta se toma por convencion:
# docs/gobierno/actas/acta-promocion-<etiqueta>.md. La etiqueta final vX.Y.Z va sobre el commit del candidato ya
# promovido y no vuelve a desplegar.
on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta SemVer candidata (vX.Y.Z-rc.N o vX.Y.Z)
        required: true
      acta:
        description: Acta de promocion que nombra la etiqueta, en docs/gobierno/actas/ de la rama desde la que se lanza
        required: true

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  desplegar:
    name: 8 Despliegue a staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write # agrega la etiqueta SemVer a las imagenes ya firmadas
    env:
      ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
      ACTA: ${{ inputs.acta || format('docs/gobierno/actas/acta-promocion-{0}.md', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Etiqueta SemVer integrada en develop, main o release, y acta que la nombra (sec. 31.2)
        run: |
          [[ "$ETIQUETA" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] \
            || { echo "::error::$ETIQUETA no es una etiqueta SemVer"; exit 1; }
          [[ "$ACTA" =~ ^docs/gobierno/actas/[a-z0-9.-]+\.md$ ]] && grep -qF "$ETIQUETA" "$ACTA" \
            || { echo "::error::$ACTA no existe o no nombra $ETIQUETA"; exit 1; }
          COMMIT="$(git rev-parse --verify --quiet "refs/tags/$ETIQUETA^{commit}")" \
            || { echo "::error::no existe la etiqueta $ETIQUETA"; exit 1; }
          git branch -r --contains "$COMMIT" | grep -qE '^ *origin/(develop|main|release/.+)$' \
            || { echo "::error::$ETIQUETA no esta integrada en develop, main ni release"; exit 1; }
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          git checkout --quiet "$COMMIT" # infraestructura y scripts de la misma etiqueta que las imagenes
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagenes del commit, firmadas por la etapa 6, con la etiqueta SemVer (Tabla 53, AU-12)
        run: |
          for nombre in api portal; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/sce-$nombre"
            digest="$(docker buildx imagetools inspect "$ref:sha-${COMMIT:0:12}" --format '{{json .Manifest}}' | jq -er .digest)"
            cosign verify "$ref@$digest" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/(develop|main|release/.+)$" >/dev/null
            docker buildx imagetools create --tag "$ref:$ETIQUETA" "$ref@$digest"
            echo "IMAGEN_${nombre^^}=$ref@$digest" >> "$GITHUB_ENV"
          done
      - name: Staging con la topologia de la Fig. 9, despliegue y humo del Anexo D (puerta 2 de la sec. 20.1)
        run: scripts/staging.sh "$IMAGEN_API" "$IMAGEN_PORTAL"
      - name: Registro del despliegue (31.2)
        if: always()
        run: cat reportes/staging/despliegue.md reportes/staging/rechazos.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: despliegue-staging-${{ inputs.etiqueta || github.ref_name }}
          path: reportes/staging/
          retention-days: 90
