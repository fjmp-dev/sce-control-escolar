# Ambiente de pruebas reproducible: PostgreSQL 16 + API con una cuenta sintetica por rol.
# docker compose up --build  ->  http://localhost:3001/salud  (cuentas en README.md)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sce_app
      POSTGRES_PASSWORD: sce_dev
      POSTGRES_DB: sce
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'sce_app']
      interval: 3s
      retries: 20
  api:
    build: ./api
    image: sce-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sce_app:sce_dev@db:5432/sce?schema=public
      JWT_SECRET: ${JWT_SECRET:-solo-para-el-ambiente-local-de-pruebas}
    ports: ['3001:3001']
    healthcheck: # Fig. 9 y Tabla 57. Da tiempo a las migraciones y al seed.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      retries: 40
