# Integracion continua (manual sec. 31.1, etapas 1 a 4; plan de trabajo #17).
# Ningun pull request entra a main sin estos dos trabajos en verde.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Minimo privilegio para el token del workflow; gitleaks-action lee los commits del pull request.
permissions:
  contents: read
  pull-requests: read

jobs:
  api:
    name: API - build y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # version del manual, Tabla 7
        env:
          POSTGRES_USER: sce_app
          POSTGRES_PASSWORD: sce_ci
          POSTGRES_DB: sce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sce_app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sce_app:sce_ci@localhost:5432/sce?schema=public
      JWT_SECRET: solo-para-ci-no-es-un-secreto
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Dependencias sin vulnerabilidades altas o criticas (AU-20, sec. 14.5)
        run: npm audit --audit-level=high
      - run: npx prisma generate
      - name: Estandares de programacion - ESLint, sin any (AU-10, sec. 14)
        run: npm run lint
      - name: Migraciones sobre base limpia (CI-MIG-01)
        run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - name: Pruebas con cobertura (CS-SEG, CI-AUTH, CD-DAT; RNF-MAN-001)
        run: npm run test:cov
      # Evidencia descargable por ejecucion para el auditor (F-01 #5, AU-29 y AU-30).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-lcov
          path: api/coverage/
          retention-days: 90

  ambiente:
    name: Ambiente de pruebas - Docker Compose y Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar PostgreSQL 16 y la API con datos sinteticos
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Humo - login y /auth/yo con cada uno de los seis roles (F-01 #2)
        shell: bash # explicito: activa pipefail, para que un curl fallido no lo oculte jq
        run: |
          curl -s --retry 60 --retry-all-errors --retry-delay 2 -o /dev/null localhost:3000/auth/yo
          for c in alumno profesor control.escolar coordinacion caja direccion; do
            t=$(curl -sf -X POST localhost:3000/auth/login -H 'Content-Type: application/json' \
                  -d "{\"correo\":\"$c@sce.test\",\"contrasena\":\"sce-dev-2026\"}" | jq -er .accessToken)
            curl -sf localhost:3000/auth/yo -H "Authorization: Bearer $t" \
              | jq -ec --arg rol "${c/./_}" 'select(.roles == [$rol]) | {cuenta: "'$c'", roles}'
          done
      - if: failure()
        run: docker compose logs
      - name: Trivy - imagen de la API (AU-20, sec. 14.5)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sce-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-imagen.txt
      - name: Trivy - repositorio (dependencias, secretos y configuracion)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          output: trivy-repositorio.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy
          path: trivy-*.txt
          retention-days: 90

  secretos:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
