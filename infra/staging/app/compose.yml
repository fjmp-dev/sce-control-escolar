# Servidor de aplicacion de staging y del piloto de ensayo (Fig. 9, Tabla 30, CC-022). El portal y la API no publican
# puerto: el proxy (infra/staging/proxy/, su propio proyecto) los alcanza por la red de frontera. Solo corre imagenes
# registradas y firmadas, por digest (etapa 8, Tabla 53).
# Variables en .env (plantilla: .env.example): lo escribe scripts/desplegar-staging.sh con los secretos del ambiente
# de GitHub, staging o piloto (20.2).
x-registro: &registro
  logging:
    options: { max-size: 50m, max-file: '10' }

services:
  api:
    image: ${IMAGEN_API:?}
    container_name: sce-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?} # sslmode=require y el certificado de la base como CA (Fig. 9: TCP 5432 con TLS)
      JWT_SECRET: ${JWT_SECRET:?}
    volumes: ['./db.crt:/certs/db.crt:ro']
    networks: [default, frontera]
    <<: *registro
    healthcheck: # Fig. 9 y Tabla 57
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      retries: 40
  tareas: # en cada despliegue, antes de arrancar: migraciones con registro y, salvo SEMILLA=0, datos sinteticos (RK-09)
    image: ${IMAGEN_API:?}
    profiles: [tareas]
    command:
      ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && if [ "$$SEMILLA" != 0 ]; then node prisma/seed.mts; fi']
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      CONTRASENA_SEMILLA: ${CONTRASENA_SEMILLA:?} # la de este ambiente, no la del README (20.2)
      SEMILLA: ${SEMILLA:-1} # 0 en el piloto de ensayo: sin usuarios ni datos (CC-022)
    volumes: ['./db.crt:/certs/db.crt:ro']
  web:
    image: ${IMAGEN_PORTAL:?}
    container_name: sce-portal
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001 # del servidor de Next.js a la API (CC-014); la cookie es Secure por omision
    networks: [default, frontera]
    <<: *registro
    healthcheck: # Tabla 57
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      retries: 20

networks:
  frontera: # la que comparte con el proxy; la crea este proyecto
    name: sce-frontera
