name: Caso de prueba
description: Plantilla de caso según ISO/IEC/IEEE 29119-3 (Anexo H)
labels: []
body:
  - type: input
    id: identificador
    attributes:
      label: Identificador
      description: El del manual (CF, CI, CS, CR o CD).
    validations: { required: true }
  - type: input
    id: requisito
    attributes:
      label: Requisito
    validations: { required: true }
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo, técnica y herramienta
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Precondiciones, datos y pasos
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations: { required: true }
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido, ambiente, etiqueta, evidencia, quién ejecutó y fecha
