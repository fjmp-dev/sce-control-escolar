# Etapa 8 de la Tabla 53: despliegue manual a staging, solo con etiqueta SemVer y acta, con autorizacion de PO y QA
# (sec. 31.2). La autorizacion es la regla de revisores del ambiente "staging" de GitHub: el job no empieza hasta que lo
# aprueban (hoy FJMP aprueba lo que lanza: NC-012). Despliega las imagenes que firmo la etapa 6 para el commit de la
# etiqueta, sin reconstruirlas: el mismo digest ira a piloto (Tabla 30). Staging es efimero (CC-018): se arma en este
# runner con la topologia de la Fig. 9, se verifica y se destruye; la evidencia queda como artefacto. Procedimiento:
# docs/gobierno/inventario-de-ambientes.md.
name: 8 Despliegue a staging y piloto de ensayo

# Corre al empujar una etiqueta SemVer; GitHub usa el staging.yml del commit etiquetado, asi que no necesita estar en
# main. El ambiente sale de la etiqueta (CC-022):
# - vX.Y.Z-rc.N va a "staging", con docs/gobierno/actas/acta-promocion-<etiqueta>.md (11.4).
# - vX.Y.Z va al "piloto de ensayo", con docs/gobierno/actas/acta-liberacion-<etiqueta>.md, solo si el mismo commit ya
#   paso la puerta 1 (checks de CI en verde) y la 2 (etapa 8 en staging con una etiqueta candidata), que se consultan
#   por API, y con los secretos y la CA del environment "piloto". Sin usuarios ni datos (SEMILLA=0).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta SemVer (vX.Y.Z-rc.N va a staging; vX.Y.Z, al piloto de ensayo)
        required: true
      acta:
        description: Acta de promocion o de liberacion que nombra la etiqueta, en docs/gobierno/actas/
        required: true

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  desplegar:
    name: 8 Despliegue a ${{ contains(inputs.etiqueta || github.ref_name, '-rc.') && 'staging' || 'piloto de ensayo' }}
    runs-on: ubuntu-latest
    environment: ${{ contains(inputs.etiqueta || github.ref_name, '-rc.') && 'staging' || 'piloto' }}
    permissions:
      contents: read
      packages: write # agrega la etiqueta SemVer a las imagenes ya firmadas
      checks: read # puerta 1 del piloto
      actions: read # puerta 2 del piloto
    env:
      ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
      AMBIENTE: ${{ contains(inputs.etiqueta || github.ref_name, '-rc.') && 'staging' || 'piloto' }}
      ACTA: >-
        ${{ inputs.acta || format('docs/gobierno/actas/acta-{0}-{1}.md',
        contains(github.ref_name, '-rc.') && 'promocion' || 'liberacion', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Etiqueta SemVer integrada en develop, main o release, y acta que la nombra (sec. 31.2)
        run: |
          [[ "$ETIQUETA" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] \
            || { echo "::error::$ETIQUETA no es una etiqueta SemVer"; exit 1; }
          [[ "$ACTA" =~ ^docs/gobierno/actas/[a-z0-9.-]+\.md$ ]] && grep -qF "$ETIQUETA" "$ACTA" \
            || { echo "::error::$ACTA no existe o no nombra $ETIQUETA"; exit 1; }
          COMMIT="$(git rev-parse --verify --quiet "refs/tags/$ETIQUETA^{commit}")" \
            || { echo "::error::no existe la etiqueta $ETIQUETA"; exit 1; }
          git branch -r --contains "$COMMIT" | grep -qE '^ *origin/(develop|main|release/.+)$' \
            || { echo "::error::$ETIQUETA no esta integrada en develop, main ni release"; exit 1; }
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          git checkout --quiet "$COMMIT" # infraestructura y scripts de la misma etiqueta que las imagenes
      - name: Puertas 1 y 2 de 20.1 sobre el commit, por API (piloto, CC-022)
        if: env.AMBIENTE == 'piloto'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ACTA" == docs/gobierno/actas/acta-liberacion-* ]] || { echo "::error::el piloto pide el acta de liberacion"; exit 1; }
          api="repos/$GITHUB_REPOSITORY"
          # Puerta 1: las etapas 1 a 7 de CI en verde sobre este commit (las requeridas por la proteccion de ramas).
          gh api --paginate "$api/commits/$COMMIT/check-runs?per_page=100" \
            -q '.check_runs[] | select(.name | test("^[1-7] ")) | "\(.conclusion) \(.name)"' | sort -u > puerta1.txt
          cat puerta1.txt
          for etapa in 1 2 3 4 5 7; do grep -qE "^success $etapa " puerta1.txt || { echo "::error::puerta 1: la etapa $etapa no esta en verde"; exit 1; }; done
          ! grep -vqE '^(success|skipped) ' puerta1.txt || { echo "::error::puerta 1: hay checks que no estan en verde"; exit 1; }
          # Puerta 2: este mismo commit paso la etapa 8 en staging con una etiqueta candidata.
          rc="$(gh api "$api/actions/workflows/staging.yml/runs?head_sha=$COMMIT&status=success&per_page=100" \
            -q '[.workflow_runs[] | select(.head_branch | test("-rc\\.[0-9]+$"))][0] | "\(.head_branch) \(.html_url)"')"
          [ -n "$rc" ] && [ "$rc" != "null null" ] || { echo "::error::puerta 2: el commit no paso staging con una etiqueta candidata"; exit 1; }
          { echo "### Puertas 1 y 2 (20.1)"; echo "- Puerta 1: etapas 1 a 7 en verde sobre $COMMIT"; echo "- Puerta 2: staging con $rc"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Secretos propios del piloto, distintos de los publicos, por huella (20.2; 36.1, criterio 7)
        if: env.AMBIENTE == 'piloto'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CONTRASENA_SEMILLA: ${{ secrets.CONTRASENA_SEMILLA }}
          CA_CRT: ${{ secrets.CA_CRT }}
          CA_KEY: ${{ secrets.CA_KEY }}
        run: |
          [ "${#JWT_SECRET}" -ge 32 ] && [ "${#CONTRASENA_SEMILLA}" -ge 16 ] || { echo "::error::faltan secretos del piloto o son cortos"; exit 1; }
          for s in "$JWT_SECRET" "$CONTRASENA_SEMILLA"; do
            ! git grep -qF -e "$s" "$COMMIT" || { echo "::error::un secreto del piloto aparece en el repositorio"; exit 1; }
          done
          [ "$CONTRASENA_SEMILLA" != sce-dev-2026 ] || { echo "::error::la contrasena del piloto es la del README"; exit 1; }
          openssl x509 -noout -subject <<< "$CA_CRT" >/dev/null && openssl pkey -noout <<< "$CA_KEY" 2>/dev/null \
            || { echo "::error::la CA del piloto no es valida"; exit 1; }
          huella() { printf '%s' "$1" | sha256sum | cut -c1-16; }
          { echo "### Secretos del piloto (huella SHA-256, 16 caracteres)"
            echo "- JWT_SECRET: $(huella "$JWT_SECRET")"
            echo "- CONTRASENA_SEMILLA: $(huella "$CONTRASENA_SEMILLA")"
            echo "- CA: $(openssl x509 -noout -fingerprint -sha256 <<< "$CA_CRT" | cut -d= -f2)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagenes del commit, firmadas por la etapa 6, con la etiqueta SemVer (Tabla 53, AU-12)
        run: |
          imagen() { # nombre commit: referencia por digest, con la firma de la etapa 6 verificada
            local ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/sce-$1" digest
            digest="$(docker buildx imagetools inspect "$ref:sha-${2:0:12}" --format '{{json .Manifest}}' | jq -er .digest)"
            cosign verify "$ref@$digest" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/(develop|main|release/.+)$" >/dev/null
            echo "$ref@$digest"
          }
          for nombre in api portal; do
            ref="$(imagen "$nombre" "$COMMIT")"
            docker buildx imagetools create --tag "${ref%@*}:$ETIQUETA" "$ref"
            echo "IMAGEN_${nombre^^}=$ref" >> "$GITHUB_ENV"
          done
          # Rollback ensayado (20.2): desde rc.2, staging.sh despliega la candidata anterior, esta, vuelve a la anterior
          # con el respaldo previo y despliega esta otra vez.
          if [[ "$ETIQUETA" =~ -rc\.([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" -ge 2 ]; then
            anterior="${ETIQUETA%.*}.$((BASH_REMATCH[1] - 1))"
            commit_anterior="$(git rev-parse --verify --quiet "refs/tags/$anterior^{commit}")" \
              || { echo "::error::$ETIQUETA pide la candidata anterior $anterior para ensayar el rollback"; exit 1; }
            api_anterior="$(imagen api "$commit_anterior")"
            portal_anterior="$(imagen portal "$commit_anterior")"
            printf '%s\n' "ETIQUETA_ANTERIOR=$anterior" "ANTERIOR_API=$api_anterior" "ANTERIOR_PORTAL=$portal_anterior" >> "$GITHUB_ENV"
          fi
      - name: Contraseña de la semilla de esta corrida, enmascarada, para staging y Playwright (20.2)
        if: env.AMBIENTE == 'staging'
        run: |
          CONTRASENA_SEMILLA="$(openssl rand -hex 16)"
          echo "::add-mask::$CONTRASENA_SEMILLA"
          echo "CONTRASENA_SEMILLA=$CONTRASENA_SEMILLA" >> "$GITHUB_ENV"
      - name: Ambiente con la topologia de la Fig. 9, despliegue, humo del Anexo D (puerta 2 de la sec. 20.1) y calidad de datos
        run: scripts/staging.sh "$IMAGEN_API" "$IMAGEN_PORTAL"
        env:
          CONSERVAR: 1 # sigue arriba para la matriz de compatibilidad; el runner se descarta al terminar el job
          # Solo existen en el environment "piloto"; en staging llegan vacios y staging.sh genera los suyos.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CA_CRT: ${{ secrets.CA_CRT }}
          CA_KEY: ${{ secrets.CA_KEY }}
          CONTRASENA_SEMILLA: ${{ secrets.CONTRASENA_SEMILLA || env.CONTRASENA_SEMILLA }}
      # CO-COM-01 (Tabla 50) contra el staging recién verificado, con la contraseña de su semilla. Las etiquetas
      # anteriores a la matriz no traen web/playwright.config.ts y se saltan estos pasos.
      - uses: actions/setup-node@v4
        if: env.AMBIENTE == 'staging' && hashFiles('web/playwright.config.ts') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Navegadores de Playwright (Tabla 50)
        id: navegadores
        if: env.AMBIENTE == 'staging' && hashFiles('web/playwright.config.ts') != ''
        timeout-minutes: 15 # sin tope, una instalacion colgada espera 6 h (PR #106)
        run: |
          # El 11-nov-2026 esta instalacion se colgo tres veces en el PR #106; en rc.1, apt bajo 114 MB del espejo de
          # Azure a 2 MB/s. Sin tiempo de espera, apt espera para siempre una conexion que no responde.
          # Ese dia el runner tampoco resolvia azure.archive.ubuntu.com (15:43 y 16:18 UTC): se usa el archivo de Ubuntu.
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99tiempos >/dev/null
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          npm ci && npx playwright install --with-deps chromium firefox webkit
        working-directory: web
        env:
          CYPRESS_INSTALL_BINARY: 0
          DEBUG: pw:install # cada descarga queda en el registro
      - name: Compatibilidad Must - Chrome 1366 y 1920, iPhone, Android y zoom 200 % (Tabla 50, CO-COM-01)
        if: steps.navegadores.outcome == 'success'
        run: scripts/playwright.sh https://localhost reportes/staging/playwright/must --project='must-*'
      - name: Compatibilidad Should - Firefox y Edge, no bloquea (Tabla 50, CO-COM-01)
        if: ${{ !cancelled() && steps.navegadores.outcome == 'success' }}
        continue-on-error: true
        run: scripts/playwright.sh https://localhost reportes/staging/playwright/should --project='should-*'
      # Humo de rendimiento con umbrales (Tabla 48). El piloto de ensayo no tiene usuarios (SEMILLA=0): ahi va SOLO_LECTURA.
      - name: Humo de rendimiento con k6 y los umbrales de la Tabla 46
        if: ${{ !cancelled() && hashFiles('infra/rendimiento/humo.js') != '' }}
        env:
          SOLO_LECTURA: ${{ env.AMBIENTE == 'piloto' && '1' || '0' }}
        run: |
          mkdir -p reportes/staging/k6 && chmod a+rwx reportes/staging/k6
          CONTRASENA="${CONTRASENA_SEMILLA:-}" docker run --rm --network host -e SOLO_LECTURA -e CONTRASENA \
            -v "$PWD/infra/rendimiento:/r:ro" -v "$PWD/reportes/staging/k6:/salida" grafana/k6:1.6.0 \
            run -q -e API=https://localhost/api -e PORTAL=https://localhost --summary-export /salida/humo.json /r/humo.js
      - name: Registro del despliegue (31.2)
        if: always()
        run: |
          cat reportes/staging/despliegue.md reportes/staging/rollback.md reportes/staging/rechazos.txt reportes/staging/anexo-d.md \
            >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ -d reportes/staging/playwright ]; then
            scripts/matriz-compatibilidad.sh reportes/staging/playwright/*/junit.xml 2>/dev/null \
              | tee reportes/staging/playwright/matriz.md >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: despliegue-${{ contains(inputs.etiqueta || github.ref_name, '-rc.') && 'staging' || 'piloto' }}-${{ inputs.etiqueta || github.ref_name }}
          path: reportes/staging/
          retention-days: 90
